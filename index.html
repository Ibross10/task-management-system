<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TaskFlow helps you plan, prioritize, and complete work.">
  <title>TaskFlow | Task Management</title>
  <link rel="stylesheet" href="css/taskflow.css">
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">TASKFLOW</p>
        <h1>Plan less. Finish more.</h1>
        <p class="lede">A focused workspace for the work that matters today.</p>
      </div>
      <button class="primary-button" id="new-task-button" type="button">+ New task</button>
    </header>

    <section class="summary" aria-label="Task summary">
      <article><span id="total-count">0</span><p>Total tasks</p></article>
      <article><span id="active-count">0</span><p>In progress</p></article>
      <article><span id="complete-count">0</span><p>Completed</p></article>
    </section>

    <section class="controls panel" aria-label="Task filters">
      <label class="search-field">Search tasks
        <input id="search" type="search" placeholder="Search by title or description">
      </label>
      <label>Status
        <select id="status-filter"><option value="all">All statuses</option><option value="active">In progress</option><option value="completed">Completed</option></select>
      </label>
      <label>Priority
        <select id="priority-filter"><option value="all">All priorities</option><option>High</option><option>Medium</option><option>Low</option></select>
      </label>
      <label>Category
        <select id="category-filter"><option value="all">All categories</option></select>
      </label>
    </section>

    <section class="panel task-panel" aria-labelledby="task-heading">
      <div class="section-heading"><div><p class="eyebrow">WORKSPACE</p><h2 id="task-heading">Your tasks</h2></div><p id="message" role="status" aria-live="polite"></p></div>
      <div id="loading" class="loading" hidden>Loading tasks...</div>
      <ul id="task-list" class="task-list" aria-live="polite"></ul>
      <p id="empty-state" class="empty-state" hidden>No tasks match these filters.</p>
    </section>
  </main>

  <dialog id="task-dialog" aria-labelledby="dialog-title">
    <form id="task-form" method="dialog" novalidate>
      <div class="dialog-heading"><div><p class="eyebrow">TASK DETAILS</p><h2 id="dialog-title">Create a task</h2></div><button class="icon-button" id="close-dialog" type="button" aria-label="Close">×</button></div>
      <input id="task-id" name="id" type="hidden">
      <label>Title <input id="title" name="title" required maxlength="80"></label>
      <label>Description <textarea id="description" name="description" maxlength="240"></textarea></label>
      <div class="form-grid">
        <label>Category <input id="category" name="category" value="General" required maxlength="40"></label>
        <label>Priority <select id="priority" name="priority"><option>Low</option><option selected>Medium</option><option>High</option></select></label>
        <label>Due date <input id="due-date" name="dueDate" type="date" required></label>
      </div>
      <p id="form-error" class="form-error" role="alert"></p>
      <div class="dialog-actions"><button class="secondary-button" id="cancel-button" type="button">Cancel</button><button class="primary-button" id="save-button" type="submit">Save task</button></div>
    </form>
  </dialog>
  <script type="module" src="src/app.js"></script>
</body>
</html>
