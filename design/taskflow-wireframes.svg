<svg xmlns="http://www.w3.org/2000/svg" width="1960" height="1330" viewBox="0 0 1960 1330">
  <style>
    text { font-family: 'DM Sans', Arial, sans-serif; fill: #252b33; }
    .board { fill: #fff; stroke: #aeb5bf; stroke-width: 1.5; }
    .surface { fill: #f7f8fa; stroke: #c4cad2; stroke-width: 1.5; }
    .field { fill: #fff; stroke: #c4cad2; stroke-width: 1.5; }
    .label { font-size: 13px; font-weight: 600; }
    .muted { fill: #68717d; font-size: 13px; }
    .tiny { fill: #737c88; font-size: 11px; }
    .heading { font-size: 23px; font-weight: 700; }
    .title { font-size: 42px; font-weight: 700; }
    .outline { fill: none; stroke: #c4cad2; stroke-width: 1.5; }
  </style>
  <rect width="1960" height="1330" fill="#eceff2"/>
  <text x="40" y="42" font-size="18" font-weight="700">TaskFlow / Desktop dashboard / 1440 x 1024</text>
  <rect class="board" x="40" y="62" width="1440" height="1024" rx="8"/>
  <rect x="40" y="62" width="1440" height="1024" rx="8" fill="#f7f8fa"/>
  <g transform="translate(170 92)">
    <rect x="0" y="0" width="38" height="38" rx="10" fill="#dfe3e8"/>
    <text x="49" y="27" font-size="21" font-weight="700">TaskFlow</text>
    <text class="muted" x="900" y="23">A little progress every day adds up.</text>
    <text class="tiny" x="0" y="92" letter-spacing="1.6">YOUR PERSONAL WORKSPACE</text>
    <text class="title" x="0" y="150">Make room for great work.</text>
    <text class="muted" x="0" y="179">Organize your day, focus on what matters, and keep moving forward.</text>
    <rect class="field" x="1000" y="106" width="180" height="44" rx="11"/>
    <text class="label" x="1020" y="133">Calendar  Mon, Oct 26</text>
    <g transform="translate(0 216)">
      <rect class="board" width="380" height="92" rx="15"/>
      <rect class="board" x="400" width="380" height="92" rx="15"/>
      <rect class="board" x="800" width="380" height="92" rx="15"/>
      <rect x="20" y="22" width="46" height="46" rx="13" fill="#e9ebee"/>
      <rect x="420" y="22" width="46" height="46" rx="13" fill="#e9ebee"/>
      <rect x="820" y="22" width="46" height="46" rx="13" fill="#e9ebee"/>
      <text class="muted" x="82" y="39">Total tasks</text><text x="82" y="70" font-size="25" font-weight="700">0</text>
      <text class="muted" x="482" y="39">In progress</text><text x="482" y="70" font-size="25" font-weight="700">0</text>
      <text class="muted" x="882" y="39">Completed</text><text x="882" y="70" font-size="25" font-weight="700">0</text>
    </g>
    <rect x="0" y="326" width="1180" height="42" rx="10" fill="#f2f3f5" stroke="#c4cad2"/>
    <text class="muted" x="16" y="352">Success or validation message appears here</text>
    <g transform="translate(0 390)">
      <rect class="board" width="440" height="560" rx="16"/>
      <text class="heading" x="24" y="42">Create a task</text>
      <rect x="376" y="16" width="40" height="40" rx="11" fill="#eceef0"/>
      <text class="label" x="24" y="86">Task name *</text>
      <rect class="field" x="24" y="98" width="392" height="45" rx="10"/>
      <text class="muted" x="38" y="126">e.g. Finish project proposal</text>
      <text class="label" x="24" y="176">Description</text>
      <rect class="field" x="24" y="188" width="392" height="78" rx="10"/>
      <text class="muted" x="38" y="216">Add a few details (optional)</text>
      <text class="label" x="24" y="300">Category</text><text class="label" x="226" y="300">Priority</text>
      <rect class="field" x="24" y="312" width="188" height="44" rx="9"/><text class="muted" x="38" y="340">Personal</text>
      <rect class="field" x="226" y="312" width="190" height="44" rx="9"/><text class="muted" x="240" y="340">Medium</text>
      <text class="label" x="24" y="390">Due date</text>
      <rect class="field" x="24" y="402" width="392" height="44" rx="9"/><text class="muted" x="38" y="430">Choose a date</text>
      <rect x="24" y="466" width="150" height="46" rx="10" fill="#343b45"/><text x="48" y="495" font-size="14" font-weight="600" fill="#fff">+  Add task</text>
      <text class="tiny" x="24" y="538">Tasks are saved to the API database.</text>
      <rect class="board" x="460" width="720" height="560" rx="16"/>
      <text class="heading" x="484" y="42">Your tasks</text>
      <text class="muted" x="484" y="68">Keep your priorities in sight.</text>
      <rect x="1090" y="18" width="66" height="30" rx="9" fill="#f0f1f3"/><text class="tiny" x="1102" y="38">0 shown</text>
      <rect class="field" x="484" y="92" width="515" height="44" rx="10"/><text class="muted" x="502" y="120">Search tasks...</text>
      <rect class="field" x="1012" y="92" width="144" height="44" rx="10"/><text class="muted" x="1028" y="120">All tasks</text>
      <rect class="surface" x="484" y="158" width="672" height="290" rx="12"/>
      <circle class="outline" cx="820" cy="240" r="24"/><path class="outline" d="M810 240h20M820 230v20"/>
      <text class="heading" x="746" y="296">A fresh start</text>
      <text class="muted" x="690" y="324">Add your first task to get the ball rolling.</text>
      <path class="outline" d="M484 476h672"/>
      <text class="tiny" x="484" y="510">0 of 0 tasks completed</text><text class="tiny" x="1078" y="510">Refresh</text>
    </g>
    <text class="tiny" x="0" y="982">Plan with purpose. Finish with pride.</text>
  </g>

  <text x="1530" y="42" font-size="18" font-weight="700">TaskFlow / Mobile full-scroll / 390 wide</text>
  <rect class="board" x="1530" y="62" width="390" height="1240" rx="8"/>
  <rect x="1530" y="62" width="390" height="1240" rx="8" fill="#f7f8fa"/>
  <g transform="translate(1548 82)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#dfe3e8"/><text x="44" y="23" font-size="18" font-weight="700">TaskFlow</text>
    <text class="tiny" x="0" y="70" letter-spacing="1">YOUR PERSONAL WORKSPACE</text>
    <text x="0" y="111" font-size="27" font-weight="700">Make room for</text><text x="0" y="143" font-size="27" font-weight="700">great work.</text>
    <text class="muted" x="0" y="169" font-size="12">Organize your day, focus on what matters,</text><text class="muted" x="0" y="187" font-size="12">and keep moving forward.</text>
    <rect class="field" x="0" y="204" width="160" height="38" rx="10"/><text class="tiny" x="13" y="228">Calendar  Mon, Oct 26</text>
    <g transform="translate(0 256)">
      <rect class="board" width="108" height="78" rx="12"/><rect class="board" x="116" width="108" height="78" rx="12"/><rect class="board" x="232" width="108" height="78" rx="12"/>
      <text class="tiny" x="10" y="28">Total tasks</text><text x="10" y="58" font-size="22" font-weight="700">0</text>
      <text class="tiny" x="126" y="28">In progress</text><text x="126" y="58" font-size="22" font-weight="700">0</text>
      <text class="tiny" x="242" y="28">Completed</text><text x="242" y="58" font-size="22" font-weight="700">0</text>
    </g>
    <rect class="field" x="0" y="348" width="340" height="42" rx="10"/><text class="tiny" x="12" y="374">Success or validation message</text>
    <g transform="translate(0 406)">
      <rect class="board" width="340" height="300" rx="14"/>
      <text class="heading" x="16" y="34" font-size="19">Your tasks</text><text class="tiny" x="16" y="56">Keep your priorities in sight.</text>
      <rect class="field" x="16" y="72" width="308" height="40" rx="9"/><text class="muted" x="30" y="97">Search tasks...</text>
      <rect class="field" x="16" y="122" width="308" height="40" rx="9"/><text class="muted" x="30" y="147">All tasks</text>
      <rect class="surface" x="16" y="174" width="308" height="88" rx="10"/>
      <text class="label" x="120" y="206">A fresh start</text><text class="tiny" x="60" y="229">Add your first task to get started.</text>
      <text class="tiny" x="16" y="282">0 of 0 tasks completed</text>
    </g>
    <g transform="translate(0 726)">
      <rect class="board" width="340" height="468" rx="14"/>
      <text class="heading" x="16" y="38" font-size="19">Create a task</text>
      <text class="label" x="16" y="76">Task name *</text><rect class="field" x="16" y="88" width="308" height="42" rx="9"/><text class="muted" x="28" y="114">e.g. Finish project proposal</text>
      <text class="label" x="16" y="160">Description</text><rect class="field" x="16" y="172" width="308" height="66" rx="9"/><text class="muted" x="28" y="198">Add a few details (optional)</text>
      <text class="label" x="16" y="268">Category</text><rect class="field" x="16" y="280" width="145" height="40" rx="9"/><text class="tiny" x="28" y="305">Personal</text>
      <text class="label" x="176" y="268">Priority</text><rect class="field" x="176" y="280" width="148" height="40" rx="9"/><text class="tiny" x="188" y="305">Medium</text>
      <text class="label" x="16" y="350">Due date</text><rect class="field" x="16" y="362" width="308" height="40" rx="9"/><text class="muted" x="28" y="387">Choose a date</text>
      <rect x="16" y="418" width="145" height="38" rx="9" fill="#343b45"/><text x="37" y="443" font-size="13" font-weight="600" fill="#fff">+  Add task</text>
    </g>
  </g>
</svg>
